[project]
name = "tofaa-crm-backend"
version = "0.1.0"
description = "TOFAA CRM FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "supabase>=2.7",
  "resend>=2.4",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "fpdf2>=2.8",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
